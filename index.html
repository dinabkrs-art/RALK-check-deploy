<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RALK – AML/CFT Training Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#050505;color:#fff;font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .content{position:relative;z-index:1;text-align:center;padding:2rem}
  .ralk-logo{display:inline-flex;align-items:center;justify-content:center;margin-bottom:2.5rem;line-height:1}
  .ralk-logo span{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:4rem;color:#fff;letter-spacing:0.05em}
  .ralk-logo svg{width:3.2rem;height:3.2rem;margin:0 0.05em;position:relative;top:0.05em}
  h1{font-size:1.1rem;font-weight:400;color:rgba(255,255,255,0.45);letter-spacing:0.04em;margin-bottom:3rem;line-height:1.6;max-width:380px}
  .badge{display:inline-flex;align-items:center;gap:0.5rem;background:rgba(224,184,76,0.08);border:1px solid rgba(224,184,76,0.2);border-radius:999px;padding:0.35rem 1rem;font-size:0.72rem;color:#e0b84c;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:2.5rem}
  .dot{width:6px;height:6px;border-radius:50%;background:#e0b84c;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .cta{display:inline-block;background:linear-gradient(135deg,#e0b84c,#c9963e);color:#050505;font-weight:700;font-size:0.9rem;padding:0.85rem 2.5rem;border-radius:999px;text-decoration:none;letter-spacing:0.04em;transition:transform 0.2s,box-shadow 0.2s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(224,184,76,0.35)}
  .sub{margin-top:1.5rem;font-size:0.75rem;color:rgba(255,255,255,0.2)}
  .sub a{color:rgba(224,184,76,0.5);text-decoration:none}
  .sub a:hover{color:#e0b84c}
  .features{display:flex;gap:2rem;margin-top:3rem;flex-wrap:wrap;justify-content:center}
  .feat{text-align:center}
  .feat-icon{font-size:1.4rem;margin-bottom:0.4rem}
  .feat-label{font-size:0.7rem;color:rgba(255,255,255,0.3);letter-spacing:0.06em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <div class="ralk-logo">
    <span>R</span>
    <svg viewBox="0 0 60 68" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tg" x1="30" y1="2" x2="30" y2="66" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#f5d060"/>
          <stop offset="55%" stop-color="#e0b84c"/>
          <stop offset="100%" stop-color="#b8852a"/>
        </linearGradient>
      </defs>
      <polygon points="30,2 58,66 2,66" fill="url(#tg)"/>
    </svg>
    <span>LK</span>
  </div>
  <div class="badge"><span class="dot"></span>Compliance Platform — Live</div>
  <h1>AI-powered AML/CFT training.<br>Tailored by role, jurisdiction &amp; sector.</h1>
  <a href="https://app.ralk.io" class="cta">Access Platform &rarr;</a>
  <div class="features">
    <div class="feat"><div class="feat-icon">&#127757;</div><div class="feat-label">Multi-jurisdiction</div></div>
    <div class="feat"><div class="feat-icon">&#129302;</div><div class="feat-label">AI-generated</div></div>
    <div class="feat"><div class="feat-icon">&#127942;</div><div class="feat-label">Certified</div></div>
    <div class="feat"><div class="feat-icon">&#128274;</div><div class="feat-label">Secure</div></div>
  </div>
  <p class="sub">&copy; 2026 RALK by Dina Kraus &nbsp;&bull;&nbsp; <a href="https://app.ralk.io/privacy">Privacy Policy</a> &nbsp;&bull;&nbsp; <a href="mailto:hello@ralk.io">hello@ralk.io</a></p>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,stars=[];
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;stars=Array.from({length:120},()=>createStar())}
function createStar(){return{x:Math.random()*W,y:Math.random()*H,vy:-(0.3+Math.random()*1.2),size:Math.random()*1.8+0.3,alpha:Math.random(),pulse:Math.random()*Math.PI*2}}
function frame(){
  ctx.clearRect(0,0,W,H);
  stars.forEach(s=>{
    s.y+=s.vy;s.pulse+=0.02;
    const a=0.15+0.35*Math.abs(Math.sin(s.pulse));
    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    ctx.fillStyle='rgba(224,184,76,'+a+')';ctx.fill();
    if(s.y<-4){s.y=H+4;s.x=Math.random()*W}
  });
  requestAnimationFrame(frame)
}
window.addEventListener('resize',resize);resize();frame();
</script>
</body>
</html>
