<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RALK Compliance Quick-Check</title>
<meta name="description" content="A 10-minute AML / FATF risk profile & control-maturity self-assessment. Powered by RALK." />
<style>
/* ============================================================
   RALK Compliance Quick-Check — design derived from RALK
   (Inter, gold #C9A84C on near-black, gold glow, R▲LK wordmark)
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root{
  /* ralk.io blueprint — warm cream, near-black text, olive-gold (default) */
  --background:42 30% 93%;
  --foreground:0 0% 10%;
  --card:44 42% 98%;
  --card-2:42 22% 89%;
  --muted-foreground:0 0% 34%;
  --primary:43 62% 38%;
  --border:40 16% 80%;
  --input:40 16% 84%;
  --green:142 45% 34%;
  --gold:43 62% 38%;      /* RALK olive-gold #9E7A1F */
  --red:0 62% 44%;
  --blue:210 45% 42%;
  --radius:0.5rem;
}
html.dark{
  /* ralk.io dark — near-black #0C0C0D, bright olive-gold #CFA337 */
  --background:240 4% 5%;
  --foreground:0 0% 96%;
  --card:240 4% 7%;
  --card-2:0 0% 12%;
  --muted-foreground:0 0% 73%;
  --primary:43 60% 51%;
  --border:0 0% 18%;
  --input:0 0% 18%;
  --green:142 50% 45%;
  --gold:43 60% 51%;      /* #CFA337 */
  --red:0 62% 52%;
  --blue:210 50% 58%;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:hsl(var(--background));
  color:hsl(var(--foreground));
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  line-height:1.55;
}
/* starfield backdrop (RALK login vibe) */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
/* gold star field (dots) — rising upward, no diagonal streaks */
.stars::before{
  content:"";position:absolute;inset:-50%;
  background-image:
    radial-gradient(2.2px 2.2px at 15% 18%, rgba(158,122,31,.90), transparent),
    radial-gradient(1.8px 1.8px at 38% 62%, rgba(158,122,31,.75), transparent),
    radial-gradient(2.4px 2.4px at 72% 30%, rgba(158,122,31,.85), transparent),
    radial-gradient(1.8px 1.8px at 88% 70%, rgba(158,122,31,.72), transparent),
    radial-gradient(2.2px 2.2px at 55% 88%, rgba(158,122,31,.8), transparent),
    radial-gradient(1.7px 1.7px at 27% 45%, rgba(158,122,31,.66), transparent),
    radial-gradient(2.2px 2.2px at 93% 15%, rgba(158,122,31,.78), transparent),
    radial-gradient(1.7px 1.7px at 8% 78%, rgba(158,122,31,.64), transparent),
    radial-gradient(1.9px 1.9px at 63% 52%, rgba(158,122,31,.68), transparent),
    radial-gradient(1.7px 1.7px at 45% 25%, rgba(158,122,31,.66), transparent),
    radial-gradient(1.7px 1.7px at 78% 82%, rgba(158,122,31,.64), transparent);
  background-repeat:repeat;background-size:300px 300px;
  opacity:1;
  animation:qcStars 55s linear infinite;
}
@keyframes qcStars{ to{ background-position:-300px -600px } }  /* rises upward, seamless (×tile) */
@media (prefers-reduced-motion: reduce){ .stars::before{animation:none} }
html.dark .stars::before{
  background-image:
    radial-gradient(2.2px 2.2px at 15% 18%, rgba(207,163,55,.98), transparent),
    radial-gradient(1.8px 1.8px at 38% 62%, rgba(207,163,55,.75), transparent),
    radial-gradient(2.4px 2.4px at 72% 30%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.8px 1.8px at 88% 70%, rgba(207,163,55,.8), transparent),
    radial-gradient(2.2px 2.2px at 55% 88%, rgba(207,163,55,.85), transparent),
    radial-gradient(1.7px 1.7px at 27% 45%, rgba(255,255,255,.42), transparent),
    radial-gradient(2.2px 2.2px at 93% 15%, rgba(207,163,55,.85), transparent),
    radial-gradient(1.7px 1.7px at 8% 78%, rgba(207,163,55,.66), transparent),
    radial-gradient(1.9px 1.9px at 63% 52%, rgba(255,255,255,.34), transparent),
    radial-gradient(1.7px 1.7px at 45% 25%, rgba(207,163,55,.75), transparent),
    radial-gradient(1.7px 1.7px at 78% 82%, rgba(207,163,55,.66), transparent);
  opacity:1;
}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:28px 20px 80px}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.toggles{display:flex;gap:8px;align-items:center}
.tbtn{
  background:hsl(var(--card));border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));
  border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:6px;transition:.18s;
}
.tbtn:hover{border-color:hsl(var(--gold));color:hsl(var(--foreground))}
.tbtn.on{color:hsl(var(--gold));border-color:hsl(var(--gold))}

/* Wordmark R▲LK */
.wordmark{display:inline-flex;align-items:baseline;gap:.5px;font-weight:800;letter-spacing:.06em;line-height:1}
.wordmark .lt{color:hsl(var(--foreground))}
.wordmark .tri{display:inline-block;position:relative;top:.02em}
.wordmark svg{display:block}

/* Cards */
.card{
  background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:14px;
  padding:26px;margin-bottom:18px;
  box-shadow:0 2px 4px rgba(0,0,0,.05), 0 20px 44px rgba(0,0,0,.06);
}
html.dark .card{box-shadow:0 2px 4px rgba(0,0,0,.3), 0 24px 56px rgba(0,0,0,.45)}
.hero{text-align:center;padding:44px 26px}
h1{font-size:30px;font-weight:800;margin:14px 0 6px;letter-spacing:-.02em}
.tagline{color:hsl(var(--muted-foreground));font-size:16px;margin:0 0 4px}
.sub{color:hsl(var(--muted-foreground));font-size:14px;max-width:560px;margin:16px auto 0}
.pill{display:inline-block;background:hsl(var(--card-2));border:1px solid hsl(var(--border));
  color:hsl(var(--gold));border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;margin-top:20px}

/* Buttons */
.btn{
  background:hsl(var(--gold));color:#1a1408;border:none;border-radius:999px;
  padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.18s;
}
.btn:hover{filter:brightness(1.06);box-shadow:0 0 26px rgba(201,168,76,.32)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;filter:none}
.btn.ghost{background:transparent;color:hsl(var(--foreground));border:1px solid hsl(var(--border))}
.btn.ghost:hover{border-color:hsl(var(--gold));box-shadow:none}
.btn-row{display:flex;gap:12px;justify-content:space-between;margin-top:24px;flex-wrap:wrap}

/* Forms */
label{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
.field{margin-bottom:16px}
input[type=text],input[type=email],select{
  width:100%;background:hsl(var(--card-2));border:1px solid hsl(var(--input));color:hsl(var(--foreground));
  border-radius:var(--radius);padding:11px 12px;font-size:14.5px;font-family:inherit;
}
input:focus,select:focus{outline:2px solid hsl(var(--gold));outline-offset:1px;border-color:hsl(var(--gold))}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}

/* Progress */
.progress-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:hsl(var(--muted-foreground));margin-bottom:10px}
.pbar{height:6px;background:hsl(var(--card-2));border-radius:6px;overflow:hidden;margin-bottom:24px}
.pfill{height:100%;background:hsl(var(--gold));width:0;transition:width .35s ease;border-radius:6px}

/* Questions */
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dtag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:hsl(var(--gold))}
.sev{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.sev.high{background:hsla(0,62%,48%,.15);color:hsl(var(--red))}
.sev.medium{background:hsla(40,56%,55%,.15);color:hsl(var(--gold))}
.qtext{font-size:17.5px;font-weight:600;margin:2px 0 16px}
.opt{
  display:flex;gap:12px;align-items:flex-start;border:1px solid hsl(var(--border));border-radius:10px;
  padding:14px 15px;margin-bottom:10px;cursor:pointer;transition:.15s;background:hsl(var(--card-2))
}
.opt:hover{border-color:hsl(var(--gold))}
.opt.sel{border-color:hsl(var(--gold));box-shadow:0 0 0 1px hsl(var(--gold)) inset}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid hsl(var(--muted-foreground));flex:0 0 auto;margin-top:2px;transition:.15s}
.opt.sel .dot{border-color:hsl(var(--gold));background:radial-gradient(circle,hsl(var(--gold)) 0 45%,transparent 46%)}
.opt .otext{font-size:14.5px}
.checkline{display:flex;gap:12px;align-items:flex-start;border:1px solid hsl(var(--border));border-radius:10px;
  padding:13px 15px;margin-bottom:10px;cursor:pointer;background:hsl(var(--card-2));transition:.15s}
.checkline:hover{border-color:hsl(var(--gold))}
.checkline.sel{border-color:hsl(var(--gold));box-shadow:0 0 0 1px hsl(var(--gold)) inset}
.checkbox{width:18px;height:18px;border-radius:4px;border:2px solid hsl(var(--muted-foreground));flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center}
.checkline.sel .checkbox{border-color:hsl(var(--gold));background:hsl(var(--gold))}
.checkline.sel .checkbox::after{content:"✓";color:#1a1408;font-size:12px;font-weight:800;line-height:1}

/* Results */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge{position:relative;width:210px;height:210px}
.gauge .score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .score-num .n{font-size:52px;font-weight:800;line-height:1}
.gauge .score-num .of{font-size:13px;color:hsl(var(--muted-foreground))}
.riskbadge{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:8px 16px;border-radius:999px;margin-top:4px}
.riskbadge.low{background:hsla(142,50%,42%,.15);color:hsl(var(--green))}
.riskbadge.medium{background:hsla(40,56%,55%,.15);color:hsl(var(--gold))}
.riskbadge.high{background:hsla(0,62%,48%,.15);color:hsl(var(--red))}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
@media(max-width:600px){.summary-grid{grid-template-columns:1fr}}
.stat{background:hsl(var(--card-2));border:1px solid hsl(var(--border));border-radius:10px;padding:14px;text-align:center}
.stat .v{font-size:24px;font-weight:800}
.stat .l{font-size:12px;color:hsl(var(--muted-foreground));margin-top:2px}

/* Domain bars */
.dom{margin-bottom:14px}
.dom-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:6px}
.dom-name{font-weight:600}
.dom-score{font-weight:700}
.track{height:9px;background:hsl(var(--card-2));border-radius:6px;overflow:hidden}
.track .fill{height:100%;border-radius:6px;transition:width .6s ease}
.crit-flag{font-size:11px;color:hsl(var(--red));font-weight:700;margin-left:8px}

/* Matrix */
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px;margin-top:8px;font-size:12px}
.matrix .h{color:hsl(var(--muted-foreground));display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-weight:600}
.matrix .yl{color:hsl(var(--muted-foreground));writing-mode:horizontal-tb;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-weight:600;text-align:right}
.cell{border-radius:8px;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:11px;opacity:.32;border:1px solid transparent}
.cell.g{background:hsla(142,50%,42%,.5)}
.cell.a{background:hsla(40,56%,55%,.5)}
.cell.r{background:hsla(0,62%,48%,.55)}
.cell.active{opacity:1;border-color:hsl(var(--foreground));box-shadow:0 0 18px rgba(201,168,76,.25)}

/* Lead gate */
.lock-teaser{position:relative}
.locked-list{filter:blur(5px);opacity:.5;pointer-events:none;user-select:none}
.gate{border:1px solid hsl(var(--gold));background:linear-gradient(180deg,hsla(40,56%,55%,.08),transparent);border-radius:12px;padding:24px;margin-bottom:18px}
.gate h3{margin:0 0 4px;font-size:19px}
.gate p.g-sub{color:hsl(var(--muted-foreground));font-size:14px;margin:0 0 18px}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:hsl(var(--muted-foreground));margin-top:4px}
.consent input{margin-top:3px}
.err{color:hsl(var(--red));font-size:12.5px;margin-top:4px;min-height:1em}

/* Recommendations */
.rec{border-left:3px solid hsl(var(--border));padding:4px 0 4px 16px;margin-bottom:16px}
.rec.urgent{border-color:hsl(var(--red))}
.rec.improve{border-color:hsl(var(--gold))}
.rec.strong{border-color:hsl(var(--green))}
.rec .rt{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.rec .rb{font-size:13.5px;color:hsl(var(--muted-foreground));margin-top:3px}
.rec .rtier{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px}
.rtier.urgent{background:hsla(0,62%,48%,.15);color:hsl(var(--red))}
.rtier.improve{background:hsla(40,56%,55%,.15);color:hsl(var(--gold))}
.rtier.strong{background:hsla(142,50%,42%,.15);color:hsl(var(--green))}

.road-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid hsl(var(--border))}
.road-row:last-child{border-bottom:none}
.road-note{margin-top:10px;font-size:12.5px;color:hsl(var(--muted-foreground));background:hsl(var(--card-2));border:1px solid hsl(var(--border));border-radius:9px;padding:11px 13px}
.phase-block{margin-bottom:20px}
.foot{text-align:center;color:hsl(var(--muted-foreground));font-size:12px;margin-top:26px;line-height:1.6}
.foot .wordmark{font-size:13px}
.disclaimer{font-size:11.5px;color:hsl(var(--muted-foreground));background:hsl(var(--card-2));border:1px solid hsl(var(--border));border-radius:8px;padding:12px 14px;margin-top:14px}
/* white RALK logo sits on a dark plaque on the cream theme (matches ralk.io).
   Padding kept in BOTH themes so the logo size stays identical; only the bg differs. */
img.ralk-logo{background:#0e0e0e;padding:6px 12px;border-radius:9px;box-sizing:content-box}
html.dark img.ralk-logo{background:transparent}
.report-meta{font-size:13px;color:hsl(var(--muted-foreground));margin:0 2px 16px;padding-bottom:12px;border-bottom:1px solid hsl(var(--border))}
.print-header,.print-footer{display:none}
.hidden{display:none!important}
.fade{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
a{color:hsl(var(--gold))}

/* Print */
@page{margin:14mm}
@media print{
  .stars,.topbar,.btn,.btn-row,.gate,.no-print,.report-meta{display:none!important}
  html,body{background:#fff!important;color:#111!important}
  .wrap{max-width:100%;padding:0}
  /* let big cards flow across pages, but keep rows/tiles intact */
  .card{border:1px solid #e2e2e2;box-shadow:none!important;background:#fff;break-inside:auto;padding:16px;margin-bottom:12px}
  .gauge-wrap,.summary-grid,.stat,.dom,.rec,.road-row,.phase-block,.matrix,.riskbadge,.disclaimer,.road-note{break-inside:avoid}
  h1{break-after:avoid}
  .locked-list{filter:none!important;opacity:1!important}
  img.ralk-logo{background:#0e0e0e;padding:6px 12px;border-radius:9px}
  .print-header{display:flex!important;align-items:center;gap:16px;margin-bottom:16px;border-bottom:2px solid #9e7a1f;padding-bottom:12px}
  .print-header .ph-meta{font-size:12.5px;color:#333;line-height:1.4}
  .print-footer{display:block!important;margin-top:18px;border-top:1px solid #ccc;padding-top:12px;font-size:10.5px;color:#555;text-align:center;line-height:1.5}
}
</style>
</head>

<div class="wrap">

      <button class="tbtn" id="langBtn" onclick="toggleLang()">🌐 <span id="langLbl">FR</span></button>

  </div>

  <div id="app"></div>

  <div class="foot">
    <div id="brandFoot"></div>
    <div id="footNote"></div>
  </div>
</div>

/* =====================================================================
   RALK SCORING ENGINE  —  ported 1:1 from backend/scoring_utils.py
   ===================================================================== */
const SEVERITY_WEIGHTS       = { low:1.0, medium:1.35, high:1.7 };
const WRONG_DECISION_FACTORS = { low:0.45, medium:0.25, high:0.12 };
const RISK_ERROR_PENALTIES   = { low:0.04, medium:0.08, high:0.12 };
const CRITICAL_FAILURE_PENALTY = 0.12;

// module weights mirror infer_module_weight() from the backend
const MODULE_WEIGHTS = {
  sanctions:1.4, aml_kyc:1.35, ubo:1.35, pep:1.35, monitoring:1.35,
  crypto:1.3, fraud:1.3, abc:1.25, dataprotection:1.2, ai:1.15,
  governance:1.15, whistleblower:1.15
};

function clampScore(v){ return Math.max(0, Math.min(100, Math.round(v))); }

function classifyRisk(score, criticalFailures){
  if(criticalFailures >= 2 || score < 60) return "high";
  if(criticalFailures >= 1 || score < 80) return "medium";
  return "low";
}

// answer.quality: "secure" | "partial" | "critical"
function computeModule(questions, answers){
  let totalWeight=0, weighted=0, penalty=0, correct=0, criticals=0;
  questions.forEach(q=>{
    const a = answers[q.id];
    if(!a) return;
    const base = SEVERITY_WEIGHTS[q.severity];
    totalWeight += base;
    if(a.quality === "secure"){
      weighted += base; correct++;
    } else {
      // risk error (partial) or critical failure
      weighted += base * WRONG_DECISION_FACTORS[q.severity];
      penalty  += RISK_ERROR_PENALTIES[q.severity];
      if(a.quality === "critical"){
        penalty += CRITICAL_FAILURE_PENALTY;
        criticals++;
      }
    }
  });
  let score=0;
  if(totalWeight>0) score = clampScore(((weighted/totalWeight) - penalty) * 100);
  return { score, criticals, correct, total:questions.length,
           risk:classifyRisk(score,criticals) };
}

function computeSnapshot(){
  const byDomain = {};
  QUESTIONS.forEach(q=>{ (byDomain[q.domain] ||= []).push(q); });
  const modules = {};
  let critTotal = 0, totalQ=0, correctQ=0;
  Object.keys(byDomain).forEach(d=>{
    const m = computeModule(byDomain[d], STATE.answers);
    m.weight = MODULE_WEIGHTS[d] || 1.0;
    modules[d] = m;
    critTotal += m.criticals; totalQ += m.total; correctQ += m.correct;
  });
  const weightedTotal = Object.values(modules).reduce((s,m)=>s+m.score*m.weight,0);
  const weightSum = Object.values(modules).reduce((s,m)=>s+m.weight,0) || 1;
  const global = clampScore(weightedTotal/weightSum);
  return {
    modules, global,
    risk: classifyRisk(global, critTotal),
    criticals: critTotal, totalQ, correctQ
  };
}

// inherent exposure axis (separate from control-maturity score)
function exposureLevel(){
  const n = STATE.exposure.length;
  if(n >= 4) return "high";
  if(n >= 2) return "medium";
  return "low";
}
function residualRisk(controlRisk, exposure){
  // matrix: rows=control maturity(low/med/high risk), cols=exposure
  const M = {
    low:    { low:"low",    medium:"low",    high:"medium" },
    medium: { low:"low",    medium:"medium", high:"high"   },
    high:   { low:"medium", medium:"high",   high:"high"   }
  };
  return M[controlRisk][exposure];
}

/* =====================================================================
   STATE + APP
   ===================================================================== */
const STATE = {
  lang:"en", theme:"light",
  step:"hero",     // hero | profile | exposure | q0..qN | results
  qIndex:0,
  profile:{company:"",country:"",sector:"",size:""},
  exposure:[],     // ids of selected factors
  answers:{},      // qid -> {quality, idx}
  lead:null,
  unlocked:false
};
const t = k => I18N[STATE.lang][k];
const dName = d => DOMAINS[d][STATE.lang];
const app = document.getElementById("app");

function wordmark(size){
  const h = size||26;
  return `<img class="ralk-logo" src="${LOGO_URI}" alt="RALK" style="height:${h}px;width:auto;display:inline-block;vertical-align:middle" />`;
}
function riskClass(r){ return r; }
function riskLabel(r){ return r==="low"?t("riskLow"):r==="medium"?t("riskMedium"):t("riskHigh"); }
function scoreColor(score){ return score>=80?"hsl(var(--green))":score>=60?"hsl(var(--gold))":"hsl(var(--red))"; }
function riskColor(r){ return r==="low"?"hsl(var(--green))":r==="medium"?"hsl(var(--gold))":"hsl(var(--red))"; }

function renderChrome(){
  document.getElementById("brandTop").innerHTML = wordmark(24);
  document.getElementById("brandFoot").innerHTML = wordmark(15);
  document.getElementById("footNote").textContent = t("footNote");
  document.getElementById("langLbl").textContent = STATE.lang==="en" ? "FR" : "EN";
  const dark = document.documentElement.classList.contains("dark");
  document.getElementById("themeLbl").textContent = dark ? "Light" : "Dark";
  document.getElementById("themeBtn").firstChild.textContent = dark ? "☀ " : "🌙 ";
  document.documentElement.lang = STATE.lang;
}
function toggleLang(){ STATE.lang = STATE.lang==="en"?"fr":"en"; render(); }
function toggleTheme(){
  document.documentElement.classList.toggle("dark");
  STATE.theme = document.documentElement.classList.contains("dark")?"dark":"light";
  render();
}

/* ---------- screens ---------- */
function render(){
  renderChrome();
  if(STATE.step==="hero") return renderHero();
  if(STATE.step==="profile") return renderProfile();
  if(STATE.step==="exposure") return renderExposure();
  if(STATE.step==="question") return renderQuestion();
  if(STATE.step==="lead") return renderLead();
  if(STATE.step==="results") return renderResults();
}

function renderHero(){
  app.innerHTML = `
  <div class="card hero fade">
    <div style="margin-bottom:6px">${wordmark(50)}</div>
    <h1>${t("heroTitle")}</h1>
    <div class="tagline">${t("tagline")}</div>
    <p class="sub">${t("heroSub")}</p>
    <div><span class="pill">${t("pill")}</span></div>
    <div style="margin-top:26px"><button class="btn" onclick="go('profile')">${t("start")} →</button></div>
  </div>`;
}

function renderProfile(){
  const p = STATE.profile;
  const sectorOpts = SECTORS.map(s=>`<option value="${s.v}" ${p.sector===s.v?"selected":""}>${s[STATE.lang]}</option>`).join("");
  const countryOpts = COUNTRIES.map(c=> c.startsWith("──")
      ? `<option disabled>──────────────</option>`
      : `<option ${p.country===c?"selected":""}>${c}</option>`).join("");
  const sizeOpts = t("sizes").map(s=>`<option ${p.size===s?"selected":""}>${s}</option>`).join("");
  app.innerHTML = `
  <div class="card fade">
    <h1 style="font-size:22px">${t("profileTitle")}</h1>
    <p class="sub" style="margin:6px 0 20px 0;text-align:left">${t("profileSub")}</p>
    <div class="field">
      <label>${t("company")}</label>
      <input type="text" id="f_company" value="${p.company.replace(/"/g,'&quot;')}" oninput="STATE.profile.company=this.value" />
    </div>
    <div class="grid2">
      <div class="field"><label>${t("country")}</label>
        <select id="f_country" onchange="STATE.profile.country=this.value">
          <option value="">—</option>${countryOpts}
        </select></div>
      <div class="field"><label>${t("sector")}</label>
        <select id="f_sector" onchange="STATE.profile.sector=this.value">
          <option value="">—</option>${sectorOpts}
        </select></div>
    </div>
    <div class="field" style="max-width:260px"><label>${t("size")}</label>
      <select id="f_size" onchange="STATE.profile.size=this.value">
        <option value="">—</option>${sizeOpts}
      </select></div>
    <div class="btn-row">
      <button class="btn ghost" onclick="go('hero')">← ${t("back")}</button>
      <button class="btn" onclick="go('exposure')">${t("next")} →</button>
    </div>
  </div>`;
  // set selected sector value (since value attr set above may not reflect on select without option selected attr for empty)
  if(p.country) document.getElementById("f_country").value=p.country;
  if(p.sector) document.getElementById("f_sector").value=p.sector;
  if(p.size) document.getElementById("f_size").value=p.size;
}

function renderExposure(){
  const rows = EXPOSURE_FACTORS.map(f=>{
    const on = STATE.exposure.includes(f.id);
    return `<div class="checkline ${on?'sel':''}" onclick="toggleExposure('${f.id}')">
      <div class="checkbox"></div><div class="otext">${f[STATE.lang]}</div></div>`;
  }).join("");
  const noneOn = STATE.exposure.length===0 && STATE._noneClicked;
  app.innerHTML = `
  <div class="card fade">
    <h1 style="font-size:22px">${t("exposureTitle")}</h1>
    <p class="sub" style="margin:6px 0 20px 0;text-align:left">${t("exposureSub")}</p>
    ${rows}
    <div class="checkline ${noneOn?'sel':''}" onclick="clearExposure()">
      <div class="checkbox"></div><div class="otext">${t("none")}</div></div>
    <div class="btn-row">
      <button class="btn ghost" onclick="go('profile')">← ${t("back")}</button>
      <button class="btn" onclick="startQuestions()">${t("next")} →</button>
    </div>
  </div>`;
}
function toggleExposure(id){
  STATE._noneClicked=false;
  const i = STATE.exposure.indexOf(id);
  if(i>=0) STATE.exposure.splice(i,1); else STATE.exposure.push(id);
  render();
}
function clearExposure(){ STATE.exposure=[]; STATE._noneClicked=true; render(); }

function startQuestions(){ STATE.step="question"; STATE.qIndex=0; render(); }

function renderQuestion(){
  const q = QUESTIONS[STATE.qIndex];
  const total = QUESTIONS.length;
  const pct = Math.round((STATE.qIndex/total)*100);
  const opts = q.opts.map((o,i)=>{
    const sel = STATE.answers[q.id] && STATE.answers[q.id].idx===i;
    return `<div class="opt ${sel?'sel':''}" onclick="answer('${q.id}',${i})">
      <div class="dot"></div><div class="otext">${o[STATE.lang]}</div></div>`;
  }).join("");
  const answered = !!STATE.answers[q.id];
  const isLast = STATE.qIndex===total-1;
  app.innerHTML = `
  <div class="fade">
    <div class="progress-head">
      <span>${t("question")} ${STATE.qIndex+1} ${t("of")} ${total}</span>
      <span>${dName(q.domain)}</span>
    </div>
    <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qmeta">
        <span class="dtag">${dName(q.domain)}</span>
        <span class="sev ${q.severity}">${q.severity}</span>
      </div>
      <div class="qtext">${q.text[STATE.lang]}</div>
      ${opts}
      <div class="btn-row">
        <button class="btn ghost" onclick="prevQ()">← ${t("back")}</button>
        <button class="btn" ${answered?"":"disabled"} onclick="nextQ()">
          ${isLast?t("seeResults"):t("next")} →</button>
      </div>
    </div>
  </div>`;
  requestAnimationFrame(()=>{ document.querySelector(".pfill").style.width = Math.round(((STATE.qIndex+ (answered?1:0))/total)*100)+"%"; });
}
function answer(qid,idx){
  const q = QUESTIONS.find(x=>x.id===qid);
  STATE.answers[qid] = {quality:q.opts[idx].quality, idx};
  // update in place — no full re-render, so the flow does not flicker
  document.querySelectorAll('.opt').forEach((el,i)=>el.classList.toggle('sel', i===idx));
  const nextBtn = document.querySelector('.card .btn:not(.ghost)');
  if(nextBtn) nextBtn.removeAttribute('disabled');
  const pf = document.querySelector('.pfill');
  if(pf) pf.style.width = Math.round(((STATE.qIndex+1)/QUESTIONS.length)*100)+'%';
}
function nextQ(){
  if(STATE.qIndex < QUESTIONS.length-1){ STATE.qIndex++; render(); }
  else { STATE.step = STATE.unlocked ? "results" : "lead"; window.scrollTo({top:0}); render(); }
}
function prevQ(){
  if(STATE.qIndex>0){ STATE.qIndex--; render(); }
  else { STATE.step="exposure"; render(); }
}

function renderLead(){
  const p = STATE.profile;
  app.innerHTML = `
  <div class="fade">
    <div class="card" style="max-width:580px;margin:0 auto">
      <div style="text-align:center;margin-bottom:8px">${wordmark(44)}</div>
      <h1 style="font-size:22px;text-align:center">${t("leadTitle")}</h1>
      <p class="sub" style="text-align:center;margin:6px auto 22px;max-width:450px">${t("leadSub")}</p>
      <div class="grid2">
        <div class="field"><label>${t("fullName")}</label><input type="text" id="l_name"/></div>
        <div class="field"><label>${t("company")}</label><input type="text" id="l_company" value="${(p.company||'').replace(/"/g,'&quot;')}"/></div>
      </div>
      <div class="grid2">
        <div class="field"><label>${t("email")}</label><input type="email" id="l_email" placeholder="name@company.com"/></div>
        <div class="field"><label>${t("role")}</label><input type="text" id="l_role"/></div>
      </div>
      <label class="consent"><input type="checkbox" id="l_consent"/><span>${t("consent")}</span></label>
      <div class="err" id="l_err"></div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn ghost" onclick="STATE.step='question';render()">← ${t("back")}</button>
        <button class="btn" onclick="submitLead()">${t("seeScore")} →</button>
      </div>
    </div>
  </div>`;
}

function renderResults(){
  const snap = computeSnapshot();
  const exp = exposureLevel();
  const controlRisk = snap.risk; // low/medium/high control-risk
  const residual = residualRisk(controlRisk, exp);
  const col = scoreColor(snap.global);
  const company = (STATE.lead && STATE.lead.company) || STATE.profile.company || "—";
  let today;
  try { today = new Date().toLocaleDateString(STATE.lang==='fr'?'fr-FR':'en-GB',{year:'numeric',month:'long',day:'numeric'}); }
  catch(e){ today = new Date().toISOString().slice(0,10); }
  // gauge ring
  const r=90, C=2*Math.PI*r, off=C*(1-snap.global/100);
  const gauge = `
    <div class="gauge">
      <svg width="210" height="210" viewBox="0 0 210 210">
        <circle cx="105" cy="105" r="${r}" fill="none" stroke="hsl(var(--card-2))" stroke-width="14"/>
        <circle cx="105" cy="105" r="${r}" fill="none" stroke="${col}" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
          transform="rotate(-90 105 105)" style="transition:stroke-dashoffset 1s ease"/>
      </svg>
      <div class="score-num"><div class="n" style="color:${col}">${snap.global}</div><div class="of">/ 100</div></div>
    </div>`;

  // domain bars
  const bars = Object.keys(snap.modules).sort((a,b)=>MODULE_WEIGHTS[b]-MODULE_WEIGHTS[a]).map(d=>{
    const m = snap.modules[d];
    const c = scoreColor(m.score);
    const crit = m.criticals>0 ? `<span class="crit-flag">⚠ ${m.criticals} ${t("critFlag")}</span>`:"";
    return `<div class="dom">
      <div class="dom-top"><span class="dom-name">${dName(d)}${crit}</span>
        <span class="dom-score" style="color:${c}">${m.score}</span></div>
      <div class="track"><div class="fill" style="width:${m.score}%;background:${c}"></div></div>
    </div>`;
  }).join("");

  // recommendations (sorted worst first), gated
  const recs = Object.keys(snap.modules).map(d=>{
    const m=snap.modules[d];
    const tier = m.criticals>0 || m.score<60 ? "urgent" : m.score<80 ? "improve" : "strong";
    return {d,m,tier,order:(tier==="urgent"?0:tier==="improve"?1:2)+ (100-m.score)/1000};
  }).sort((a,b)=>a.order-b.order);
  const recHtml = recs.map(({d,m,tier})=>{
    const label = tier==="urgent"?"Priority":tier==="improve"?"Improve":"Strong";
    const labelFr = tier==="urgent"?"Prioritaire":tier==="improve"?"À améliorer":"Solide";
    return `<div class="rec ${tier}">
      <div class="rt"><span>${dName(d)}</span>
        <span class="rtier ${tier}">${STATE.lang==='en'?label:labelFr}</span></div>
      <div class="rb">${RECS[d][tier][STATE.lang]}</div></div>`;
  }).join("");

  // auto-generated remediation roadmap (Fahrplan) — phases from recommendation tiers
  const phases = [
    {key:"urgent",  title:t("phaseNow"),     sub:t("phaseNowSub")},
    {key:"improve", title:t("phaseShort"),   sub:t("phaseShortSub")},
    {key:"strong",  title:t("phaseSustain"), sub:t("phaseSustainSub")}
  ];
  const phaseChip = k=> k==="urgent"?(STATE.lang==="en"?"Address now":"À traiter")
                       : k==="improve"?(STATE.lang==="en"?"Strengthen":"Renforcer")
                       : (STATE.lang==="en"?"Maintain":"Maintenir");
  const roadmapHtml = phases.map((ph)=>{
    const items = recs.filter(r=>r.tier===ph.key);
    if(!items.length) return "";  // hide empty phases — cleaner report
    const dot = ph.key==="urgent"?"hsl(var(--red))":ph.key==="improve"?"hsl(var(--gold))":"hsl(var(--green))";
    const rows = items.map(({d})=>`<div class="road-row"><span class="dom-name">${dName(d)}</span><span class="rtier ${ph.key}">${phaseChip(ph.key)}</span></div>`).join("");
    return `<div class="phase-block">
      <div style="display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px">
        <span style="width:10px;height:10px;border-radius:50%;background:${dot};display:inline-block"></span>${ph.title}</div>
      <div class="sub" style="text-align:left;margin:3px 0 10px 19px">${ph.sub}</div>
      <div style="margin-left:19px">${rows}</div></div>`;
  }).join("");
  const roadmapCard = STATE.unlocked ? `
    <div class="card">
      <h1 style="font-size:19px;margin-bottom:4px">${t("roadmapTitle")}</h1>
      <p class="sub" style="text-align:left;margin:0 0 18px">${t("roadmapSub")}</p>
      ${roadmapHtml}
      <div class="road-note">${t("roadmapNote")}</div>
    </div>` : "";

  // residual matrix (rows control maturity high->low mapped to strong/partial/weak)
  const cmRow = controlRisk==="low"?0:controlRisk==="medium"?1:2; // 0 strong ..2 weak
  const exCol = exp==="low"?0:exp==="medium"?1:2;
  const cellClass=[["g","g","a"],["g","a","r"],["a","r","r"]];
  let matrix = `<div class="matrix">
    <div></div><div class="h">${t("exLow")}</div><div class="h">${t("exMed")}</div><div class="h">${t("exHigh")}</div>`;
  const rowLabels=[t("cmHigh"),t("cmMed"),t("cmLow")];
  for(let r0=0;r0<3;r0++){
    matrix+=`<div class="yl">${rowLabels[r0]}</div>`;
    for(let c0=0;c0<3;c0++){
      const active = (r0===cmRow && c0===exCol);
      matrix+=`<div class="cell ${cellClass[r0][c0]} ${active?'active':''}">${active?(residual==="low"?t("riskLow"):residual==="medium"?t("riskMedium"):t("riskHigh")):""}</div>`;
    }
  }
  matrix+=`</div>`;

  const critNote = snap.criticals>0 ? `<div class="disclaimer" style="border-color:hsl(var(--red));color:hsl(var(--red))">${t("crit")}</div>`:"";

  const actionRow = STATE.unlocked ? `
    <div class="card no-print" style="text-align:center;border-color:hsl(var(--gold));background:linear-gradient(180deg,hsla(43,62%,45%,.10),transparent)">
      <div style="font-weight:800;font-size:19px;margin-bottom:6px">${t("ctaTitle")}</div>
      <p class="sub" style="text-align:center;margin:0 auto 18px;max-width:540px">${t("ctaBody")}</p>
      <a class="btn" href="${CONFIG.PRODUCT_URL}" target="_blank" rel="noopener" style="font-size:16px;padding:15px 32px;text-decoration:none">${t("getRalk")}</a>
      <div class="btn-row" style="justify-content:center;gap:12px;margin-top:16px">
        <button class="btn ghost" onclick="window.print()">⬇ ${t("download")}</button>
        <button class="btn ghost" onclick="bookDemo(${snap.global})">${t("demo")}</button>
      </div>
    </div>` : "";

  app.innerHTML = `
  <div class="fade">
    <div class="print-header">
      ${wordmark(30)}
      <div class="ph-meta"><strong>Compliance Quick-Check</strong><br>${t("preparedFor")}: ${company} · ${today}</div>
    </div>
    <div class="report-meta">${t("preparedFor")}: <strong>${company}</strong> · ${t("assessmentDate")}: ${today}</div>
    <div class="card" style="text-align:center">
      <div class="gauge-wrap">
        <div style="font-size:13px;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">${t("yourScore")}</div>
        ${gauge}
        <div class="riskbadge ${controlRisk}">● ${riskLabel(controlRisk)}</div>
      </div>
      <div class="summary-grid">
        <div class="stat"><div class="v" style="color:hsl(var(--green))">${snap.correctQ}/${snap.totalQ}</div><div class="l">${t("statCorrect")}</div></div>
        <div class="stat"><div class="v" style="color:${snap.criticals?'hsl(var(--red))':'hsl(var(--foreground))'}">${snap.criticals}</div><div class="l">${t("statCritical")}</div></div>
        <div class="stat"><div class="v" style="color:${riskColor(exp)}">${exp==='low'?t('riskLow').split(' ')[0]:exp==='medium'?(STATE.lang==='en'?'Medium':'Moyenne'):(STATE.lang==='en'?'High':'Élevée')}</div><div class="l">${t("statExposure")}</div></div>
      </div>
      ${critNote}
    </div>

    <div class="card">
      <h1 style="font-size:19px;margin-bottom:16px">${t("breakdownTitle")}</h1>
      ${bars}
    </div>

    <div class="card">
      <h1 style="font-size:19px;margin-bottom:4px">${t("matrixTitle")}</h1>
      <p class="sub" style="text-align:left;margin:0 0 6px">${t("matrixSub")}</p>
      ${matrix}
    </div>

    <div class="card">
      <h1 style="font-size:19px;margin-bottom:16px">${t("recsTitle")}</h1>
      <div>${recHtml}</div>
    </div>

    ${roadmapCard}
    ${actionRow}
    <div class="disclaimer">${t("disclaimer")}</div>
    <div class="print-footer">${t("legalRights")}<br>${t("legalPurpose")}</div>
    <div class="btn-row no-print"><button class="btn ghost" onclick="restart()">↺ ${t("restart")}</button><span></span></div>
  </div>`;
  requestAnimationFrame(()=>{ const c=document.querySelector(".gauge circle:last-child"); if(c) c.style.strokeDashoffset=off; });
}

function submitLead(){
  const name=(document.getElementById("l_name").value||"").trim();
  const email=(document.getElementById("l_email").value||"").trim();
  const role=(document.getElementById("l_role").value||"").trim();
  const company=(document.getElementById("l_company").value||"").trim();
  const consent=document.getElementById("l_consent").checked;
  const err=document.getElementById("l_err");
  err.textContent="";
  if(!name){ err.textContent=t("errName"); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent=t("errEmail"); return; }
  if(!consent){ err.textContent=t("errConsent"); return; }
  const snap=computeSnapshot();
  STATE.lead={name,email,role,company,country:STATE.profile.country,sector:STATE.profile.sector,
    score:snap.global,risk:snap.risk,criticals:snap.criticals,exposure:exposureLevel(),ts:new Date().toISOString()};
  // send to endpoint if configured (fire-and-forget; unlock happens regardless)
  if(CONFIG.LEAD_ENDPOINT){
    const l = STATE.lead;
    const payload = {
      Name:l.name, Email:l.email, Role:l.role, Company:l.company,
      Country:l.country, Sector:l.sector, Score:`${l.score}/100`, Risk:l.risk,
      "Critical gaps":l.criticals, "Inherent exposure":l.exposure,
      Language:STATE.lang, Submitted:l.ts,
      _subject:`New RALK lead — ${l.company||l.name||l.email} (${l.score}/100, ${l.risk} risk)`,
      _template:"table"
    };
    try{
      fetch(CONFIG.LEAD_ENDPOINT,{method:"POST",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify(payload)}).catch(()=>{});
    }catch(e){}
  }
  STATE.unlocked=true;
  STATE.step="results";
  render();
  window.scrollTo({top:0});
}

function bookDemo(score){
  const l=STATE.lead||{};
  const subj=encodeURIComponent(`RALK consultation — Quick-Check score ${score}/100`);
  const body=encodeURIComponent(
    `Hello RALK team,\n\nI completed the Compliance Quick-Check and would like to discuss my remediation roadmap.\n\n`+
    `Name: ${l.name||""}\nInstitution: ${l.company||STATE.profile.company||""}\nCountry: ${STATE.profile.country||""}\n`+
    `Score: ${score}/100 (${(STATE.lead&&STATE.lead.risk)||""} risk)\n\nThank you.`);
  window.location.href=`mailto:${CONFIG.CONTACT_EMAIL}?subject=${subj}&body=${body}`;
}

function restart(){
  STATE.step="hero"; STATE.qIndex=0; STATE.answers={}; STATE.exposure=[];
  STATE.profile={company:"",country:"",sector:"",size:""}; STATE.unlocked=false; STATE.lead=null;
  window.scrollTo({top:0}); render();
}
function go(step){ STATE.step=step; window.scrollTo({top:0}); render(); }

render();
</script>
</body>
